        default: *id009
      parameters:
      - name: id
        in: path
        required: true
        schema: *id010
  /assets/{id}/events:
    get:
      operationId: getAssetsIdEvents
      summary: Read immutable scoped Asset history
      description: ACTIVE authorized principal; backend-loaded target facts and actors. Tenant path is validated
