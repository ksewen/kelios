  /audit-log:
    get:
      operationId: getAudit-log
      summary: ADMIN only; GLOBAL all, TENANT own captured Tenant in SQL
      description: Immutable captured target-Tenant scope. ADMIN only; TENANT ADMIN is forced to own signed Tenant. For GLOBAL ADMIN, neither tenantId nor globalOnly means all authorized records; globalOnly=true selects captured Global attribution, and tenantId selects one captured Tenant. Those narrowing parameters are mutually exclusive. Combined exact criteria, inclusive independently optional UTC/offset instants and server ordering apply before bounded paging/count. Client date-time inputs convert local time to UTC; there is no date-only or whole-day query mode. No text search or live User joins. Default occurredAt DESC; equal timestamps have no mandated secondary UUID order. Time bounds must align with PostgreSQL microsecond precision; reversed bounds rejected. Page0/size20/max100; beyond-end pages are empty with current metadata.
      security: *id008
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        default: *id009
