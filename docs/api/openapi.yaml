openapi: 3.1.0
info:
  title: KELIOS Phase 3 inventory and identity API
  version: 0.0.3
  description: Same-origin HTTPS. Access JWT in memory/Bearer; Refresh HttpOnly cookie. Explicit inventory commands,
    scoped reads and target-owned administrative audit. No Asset deletion API. Backend authorization is authoritative;
    no persistent sessions or revocation.
servers:
- url: /api/v1
paths:
  /status:
    get:
      operationId: getStatus
      summary: Verify backend connectivity
      security: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalStatus'
        default: &id001
          description: RFC 9457 sanitized error; 400 invalid input, 401 authentication failure, 403 denied, 404
            absent target, 409 conflict, 429 bounded throttling, 503 unavailable verification.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/csrf:
    get:
      operationId: getAuthCsrf
      summary: Obtain signed CSRF proof
      security: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        default: *id001
      description: Sets Secure HttpOnly host-only __Secure-kelios-csrf at /api/v1/auth/. Bound to current refresh
        jti when valid; no server session. Use before unsafe auth operations.
  /auth/local/login:
    post:
      operationId: postAuthLocalLogin
      summary: Authenticate GLOBAL local credentials
      security: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalLogin'
      parameters: &id002
      - &id004
        name: Origin
        in: header
        required: true
        description: Exact configured same-origin HTTPS browser origin.
        schema:
          type: string
          format: uri
      - &id005
        name: X-CSRF-Token
        in: header
        required: true
        description: Proof from GET /auth/csrf; browser also sends its matching HttpOnly cookie.
        schema:
          type: string
      description: Sets Secure HttpOnly host-only SameSite=Strict Refresh cookie; Access JWT returned to memory
        only. PENDING may authenticate but has no business access; DISABLED denied.
  /auth/session/refresh:
    post:
      operationId: postAuthSessionRefresh
      summary: Reload current User and issue Access JWT
      security: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default: *id001
      parameters: *id002
      description: Requires ambient __Secure-kelios-refresh cookie. Validates Refresh purpose/signature/issuer/audience/absolute
        expiry, reloads KELIOS User, denies DISABLED. Reuses original Refresh JWT/expiry. Does not contact IServ.
  /auth/session:
    delete:
      operationId: deleteAuthSession
      summary: Discard browser session tokens
      security: []
      responses:
        '200':
          description: Successful operation; empty response body.
        default: *id001
      parameters: *id002
      description: Clears Refresh/CSRF/OIDC flow cookies. Frontend discards memory Access; no revocation state is
        created. Copied tokens remain valid under their approved lifetimes.
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Get authenticated JWT identity
      security: &id003
      - AccessBearer: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default: *id001
      description: Phase 2 current-user infrastructure; PENDING may access this minimal identity. Access reflects
        issue-time snapshot until refresh/re-login.
  /auth/local/password:
    put:
      operationId: putAuthLocalPassword
      summary: Change own GLOBAL password with current verification
      security: *id003
      responses:
        '200':
          description: Successful operation; empty response body.
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      parameters: *id002
      description: ACTIVE GLOBAL user only. Uniform password policy; existing JWTs are not independently revoked.
  /auth/oidc/{tenant}/start:
    post:
      operationId: postAuthOidcTenantStart
      summary: Initiate configured Tenant IServ login
      security: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcStart'
        default: *id001
      parameters:
      - name: tenant
        in: path
        required: true
        schema: &id006
          type: string
          format: uuid
      - *id004
      - *id005
      description: Server loads enabled provider by Tenant ID, uses Discovery, state/nonce/PKCE S256 and encrypted
        HttpOnly flow cookie. No caller-supplied issuer, identities, group facts or callback URI.
  /auth/oidc/{tenant}/callback:
    get:
      operationId: getAuthOidcTenantCallback
      summary: Complete protected Tenant OIDC flow
      security: []
      responses:
        '303':
          description: Fixed trusted-origin /auth/complete or /auth/failed redirect. Success sets Refresh cookie
            and clears flow cookie.
          headers:
            Location:
              schema:
                type: string
                format: uri
        default: *id001
      parameters:
      - name: tenant
        in: path
        required: true
        schema: *id006
      - name: state
        in: query
        required: false
        schema: &id007
          type: string
      - name: code
        in: query
        required: false
        schema: *id007
      - name: iss
        in: query
        required: false
        schema: *id007
      - name: error
        in: query
        required: false
        schema: *id007
      description: Requires flow cookie binding. Validated ID token and UserInfo sub, documented iserv:groups UUID
        intersection, exact issuer/subject identity, JIT TENANT/USER/PENDING. Provider tokens discarded. No tokens
        or provider error details in frontend redirect.
  /tenants:
    get:
      operationId: getTenants
      summary: List authorized Tenant identifiers
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenants'
        default: *id001
      description: ACTIVE GLOBAL users read all; ACTIVE TENANT users read only their Tenant. PENDING/DISABLED have
        no business data.
    post:
      operationId: postTenants
      summary: Create Tenant (GLOBAL ADMIN)
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uuid'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
  /users:
    get:
      operationId: getUsers
      summary: List administratively manageable users
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identities'
        default: *id001
      description: GLOBAL ADMIN all; TENANT ADMIN own ordinary USER accounts only. Readers denied.
  /users/global:
    post:
      operationId: postUsersGlobal
      summary: Create GLOBAL USER ACTIVE (GLOBAL ADMIN)
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalInput'
      description: Null Tenant, explicit GLOBAL/USER/ACTIVE. ADMIN grant is separate; initial provided password
        is actual credential.
  /users/{id}/approve:
    post:
      operationId: postUsersIdApprove
      summary: Approve PENDING account
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      description: GLOBAL ADMIN any; TENANT ADMIN own ordinary USER only, no ADMIN approval.
  /users/{id}/role:
    put:
      operationId: putUsersIdRole
      summary: Grant or change role (GLOBAL ADMIN)
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      description: TENANT ADMIN cannot grant ADMIN. GLOBAL ADMIN cannot demote itself. No permanent last-admin invariant.
  /users/{id}/disable:
    post:
      operationId: postUsersIdDisable
      summary: Disable managed account
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      description: GLOBAL ADMIN any other account; TENANT ADMIN own ordinary USER only. GLOBAL ADMIN self-disable
        denied. Future Refresh denied; issued Access expires naturally.
  /users/{id}/local-credential:
    put:
      operationId: putUsersIdLocal-credential
      summary: Create/reset GLOBAL credential (GLOBAL ADMIN)
      security: *id003
      responses:
        '200':
          description: Successful operation; empty response body.
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInput'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      description: No TENANT credentials. Uniform policy; no forced-change state or JWT revocation.
  /tenants/{id}/oidc:
    get:
      operationId: getTenantsIdOidc
      summary: Read sanitized Tenant OIDC configuration (GLOBAL ADMIN)
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfiguration'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
    put:
      operationId: putTenantsIdOidc
      summary: Create/update Tenant OIDC and group UUID allowlist (GLOBAL ADMIN)
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfiguration'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderInput'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      description: Atomic versioned settings/secret/allowlist change. Omit/null version on first create; current
        version on update. Initial clientSecret required; null on update retains/re-encrypts existing secret. Secret
        only accepted as write-only input, never returned. Empty allowlist denies login. Runtime changes need no
        image rebuild; in-flight old-config login fails closed.
  /tenants/{tenantId}/assets:
    post:
      operationId: postTenantsTenantidAssets
      summary: Register Asset; ADMIN only
      description: ACTIVE authorized principal; backend-loaded target facts and actors. Tenant path is validated
        operating context, never membership/session state. Public Asset reads exclude internal soft deletion; DEREGISTERED
        remains visible.
      security: &id008
      - AccessBearer: []
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          headers:
            Location:
              schema:
                type: string
              description: Created resource path
        default: &id009
          description: RFC 9457. 400 INVALID_INPUT; 401 AUTHENTICATION_REQUIRED; 403 FORBIDDEN; 404 NOT_FOUND including
            out-of-scope object; 409 guard/version/concurrency/constraint conflict; 503 SERVICE_UNAVAILABLE. No
            automatic mutation retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: tenantId
        in: path
        required: true
        schema: &id010
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRegistration'
    get:
      operationId: getTenantsTenantidAssets
      summary: Read authorized Tenant Assets
      description: ACTIVE authorized principal; backend-loaded target facts and actors. Tenant path is validated
        operating context, never membership/session state. Public Asset reads exclude internal soft deletion; DEREGISTERED
        remains visible.
      security: *id008
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        default: *id009
      parameters:
      - name: tenantId
        in: path
        required: true
        schema: *id010
      - &id011
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - &id012
        name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - &id013
        name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
          description: Literal case-insensitive substring of tag, local identifier, serial and external inventory number; SQL wildcards
            escaped.
      - &id014
        name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - tag
          - createdAt
          - lifecycle
          - condition
          default: createdAt
      - &id015
        name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - &id016
        name: locationId
        in: query
        required: false
        schema: *id010
      - &id017
        name: ownerId
        in: query
        required: false
        schema: *id010
      - &id018
        name: categoryId
        in: query
        required: false
        schema: *id010
      - &id019
        name: manufacturerId
        in: query
        required: false
        schema: *id010
      - &id020
        name: productId
        in: query
        required: false
        schema: *id010
      - &id021
        name: lifecycle
        in: query
        required: false
        schema: &id032
          type: string
          enum:
          - REGISTERED
          - IN_STOCK
          - DEPLOYED
          - DEREGISTERED
      - &id022
        name: condition
        in: query
        required: false
        schema: &id033
          type: string
          enum:
          - UNKNOWN
          - WORKING
          - DEFECTIVE
          - UNUSABLE
      - &id023
        name: loaned
        in: query
        required: false
        schema:
          type: boolean
  /assets:
    get:
      operationId: getAssets
      summary: GLOBAL-only all-Tenant Asset read
      description: ACTIVE authorized principal; backend-loaded target facts and actors. Tenant path is validated
        operating context, never membership/session state. Public Asset reads exclude internal soft deletion; DEREGISTERED
