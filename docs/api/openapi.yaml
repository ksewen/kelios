  /catalog/categories:
    get:
      operationId: getCatalogCategories
      summary: Read visible categories
      description: ACTIVE authorized principal; backend-loaded target facts and actors. Tenant path is validated
        operating context, never membership/session state. Public Asset reads exclude internal soft deletion; DEREGISTERED
        remains visible.
      security: *id008
      responses:
        '200':
          description: Successful operation
