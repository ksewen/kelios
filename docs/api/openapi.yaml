        in: query
        required: false
        schema:
          type: string
      - name: targetId
        in: query
        required: false
        schema: *id010
      - name: tenantId
        in: query
        required: false
        schema: *id010
      - name: globalOnly
        in: query
        required: false
        schema:
          type: boolean
      - name: actorId
        in: query
        schema: *id010
      - name: from
        in: query
        description: Inclusive lower UTC/offset instant; microsecond precision. Optional independently.
        schema:
          type: string
          format: date-time
      - name: until
        in: query
        description: Inclusive upper UTC/offset instant; microsecond precision. Optional independently.
        schema:
          type: string
          format: date-time
      - name: sort
        in: query
        schema:
          type: string
          enum: [occurredAt]
      - name: direction
        in: query
        description: Only occurredAt is sortable; direction may be supplied alone. Default desc.
        schema:
          type: string
          enum: [asc, desc]
          default: desc
