        remains visible.
      security: *id008
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default: *id009
      parameters:
      - name: id
        in: path
        required: true
        schema: *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoanabilityCommand'
  /assets/{id}/lifecycle-transitions:
    post:
      operationId: postAssetsIdLifecycle-transitions
      summary: ADMIN explicit lifecycle-transitions command; expectedVersion required
