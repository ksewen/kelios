      security: *id008
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default: *id009
      parameters:
      - name: id
        in: path
        required: true
        schema: *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleCommand'
  /assets/{id}/condition-transitions:
    post:
      operationId: postAssetsIdCondition-transitions
      summary: ADMIN explicit condition-transitions command; expectedVersion required
      description: ACTIVE authorized principal; backend-loaded target facts and actors. Tenant path is validated
