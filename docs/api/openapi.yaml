components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 purpose Access, current signed scope/role/status snapshot. Refresh cookie is never an API
        business credential.
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title: *id007
        status:
          type: integer
        detail: *id007
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable safe business error, including INVALID_INPUT, STALE_ASSET_VERSION, INVALID_TRANSITION,
            LOAN_GUARD, NO_CURRENT_LOAN, OUTSTANDING_LOAN, REFERENCED, PRODUCT_EDIT_FROZEN, PROTECTED_UNKNOWN, DELETED_TARGET,
            INVALID_DEPENDENCY, CONCURRENT_OPERATION, CONSTRAINT_CONFLICT and SERVICE_UNAVAILABLE.
    TechnicalStatus:
      type: object
      required:
      - application
      - status
      properties:
        application:
          type: string
          const: KELIOS
        status:
          type: string
          const: ready
    Uuid: *id006
    Identity:
      type: object
      required:
      - id
      - scope
      - role
      - status
      - displayName
      properties:
        id: *id006
        scope:
          type: string
          enum:
          - GLOBAL
          - TENANT
        tenantId:
          type:
          - string
          - 'null'
          format: uuid
        role:
          type: string
          enum:
          - ADMIN
          - USER
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - DISABLED
        displayName: *id007
    Identities:
      type: array
      items:
        $ref: '#/components/schemas/Identity'
    Tenant:
      type: object
      required:
      - id
      - name
      properties:
        id: *id006
        name: *id007
    Tenants:
      type: array
      items:
        $ref: '#/components/schemas/Tenant'
    Session:
      type: object
      required:
      - accessToken
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
          description: RS256 Access JWT; memory only, never URL/browser persistent storage.
        expiresIn:
          type: integer
          const: 900
        user:
          $ref: '#/components/schemas/Identity'
    Csrf:
      type: object
      required:
      - token
      properties:
        token: *id007
    LocalLogin:
      type: object
      required:
      - login
      - password
      properties:
        login: &id026
          type: string
          minLength: 3
          maxLength: 64
          pattern: ^[A-Za-z0-9._-]{3,64}$
          description: Canonicalized to lowercase; unique GLOBAL credential identifier, unrelated to display name/email.
        password:
          type: string
          writeOnly: true
    PasswordChange:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword: &id027
          type: string
          writeOnly: true
          description: 15–128 Unicode code points, not trimmed; uppercase, lowercase, digit and non-alphanumeric
            required. No forced-change state.
    OidcStart:
      type: object
      required:
      - authorizationUrl
      properties:
        authorizationUrl:
          type: string
          format: uri
    TenantInput:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
    GlobalInput:
      type: object
      required:
      - login
      - displayName
      - password
      properties:
        login: *id026
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        password: *id027
    RoleInput:
      type: object
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - ADMIN
          - USER
    CredentialInput:
      type: object
      required:
      - login
      - password
      properties:
        login: *id026
        password: *id027
    ProviderInput:
      type: object
      required:
      - issuer
      - clientId
      - enabled
      - allowedGroupIds
      properties:
        issuer:
          type: string
          format: uri
          maxLength: 2048
          description: Exact HTTPS IServ issuer; Discovery issuer must match.
        clientId:
          type: string
          minLength: 1
          maxLength: 2048
        clientSecret:
          type:
          - string
          - 'null'
          writeOnly: true
          maxLength: 2048
        enabled:
          type: boolean
        version:
          type:
          - integer
          - 'null'
          minimum: 0
        allowedGroupIds:
          type: array
          uniqueItems: true
          maxItems: 256
          items: *id006
