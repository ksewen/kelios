openapi: 3.1.0
info:
  title: KELIOS Phase 3 inventory and identity API
  version: 0.0.3
  description: Same-origin HTTPS. Access JWT in memory/Bearer; Refresh HttpOnly cookie. Explicit inventory commands,
    scoped reads and target-owned administrative audit. No Asset deletion API. Backend authorization is authoritative;
    no persistent sessions or revocation.
servers:
- url: /api/v1
paths:
  /status:
    get:
      operationId: getStatus
      summary: Verify backend connectivity
      security: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalStatus'
        default: &id001
          description: RFC 9457 sanitized error; 400 invalid input, 401 authentication failure, 403 denied, 404
            absent target, 409 conflict, 429 bounded throttling, 503 unavailable verification.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/csrf:
    get:
      operationId: getAuthCsrf
      summary: Obtain signed CSRF proof
      security: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Csrf'
        default: *id001
      description: Sets Secure HttpOnly host-only __Secure-kelios-csrf at /api/v1/auth/. Bound to current refresh
        jti when valid; no server session. Use before unsafe auth operations.
  /auth/local/login:
    post:
      operationId: postAuthLocalLogin
      summary: Authenticate GLOBAL local credentials
      security: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocalLogin'
      parameters: &id002
      - &id004
        name: Origin
        in: header
        required: true
        description: Exact configured same-origin HTTPS browser origin.
        schema:
          type: string
          format: uri
      - &id005
        name: X-CSRF-Token
        in: header
        required: true
        description: Proof from GET /auth/csrf; browser also sends its matching HttpOnly cookie.
        schema:
          type: string
      description: Sets Secure HttpOnly host-only SameSite=Strict Refresh cookie; Access JWT returned to memory
        only. PENDING may authenticate but has no business access; DISABLED denied.
  /auth/session/refresh:
    post:
      operationId: postAuthSessionRefresh
      summary: Reload current User and issue Access JWT
      security: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        default: *id001
      parameters: *id002
      description: Requires ambient __Secure-kelios-refresh cookie. Validates Refresh purpose/signature/issuer/audience/absolute
        expiry, reloads KELIOS User, denies DISABLED. Reuses original Refresh JWT/expiry. Does not contact IServ.
  /auth/session:
    delete:
      operationId: deleteAuthSession
      summary: Discard browser session tokens
      security: []
      responses:
        '200':
          description: Successful operation; empty response body.
        default: *id001
      parameters: *id002
      description: Clears Refresh/CSRF/OIDC flow cookies. Frontend discards memory Access; no revocation state is
        created. Copied tokens remain valid under their approved lifetimes.
  /auth/me:
    get:
      operationId: getAuthMe
      summary: Get authenticated JWT identity
      security: &id003
      - AccessBearer: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default: *id001
      description: Phase 2 current-user infrastructure; PENDING may access this minimal identity. Access reflects
        issue-time snapshot until refresh/re-login.
  /auth/local/password:
    put:
      operationId: putAuthLocalPassword
      summary: Change own GLOBAL password with current verification
      security: *id003
      responses:
        '200':
          description: Successful operation; empty response body.
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
      parameters: *id002
      description: ACTIVE GLOBAL user only. Uniform password policy; existing JWTs are not independently revoked.
  /auth/oidc/organizations:
    get:
      operationId: getAuthOidcOrganizations
      summary: Discover enabled organizations for authentication routing
      description: Anonymous bounded directory. Names and routing IDs only; selection grants no Tenant authority. No default-provider inference.
      security: []
      parameters:
        - in: query
          name: page
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
        - in: query
          name: size
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - in: query
          name: q
          description: Literal case-insensitive organization-name substring. Surrounding whitespace is stripped; blank means no text search. The 128-character bound applies after stripping (Java UTF-16 units); %, _ and backslash are literal.
          schema: {type: string, default: ''}
      responses:
        '200':
          description: Enabled configured organizations only
          content:
            application/json:
              schema:
                type: object
                required: [items, totalElements, page, size]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [routingId, name]
                      properties:
                        routingId: {type: string, format: uuid, description: Untrusted routing handle used in the existing OIDC start path}
                        name: {type: string}
                  totalElements: {type: integer, format: int64}
                  page: {type: integer}
                  size: {type: integer}
        '400':
          description: Invalid bounded directory query
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /auth/oidc/{tenant}/start:
    post:
      operationId: postAuthOidcTenantStart
      summary: Initiate configured Tenant IServ login
      security: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcStart'
        default: *id001
      parameters:
      - name: tenant
        in: path
        required: true
        schema: &id006
          type: string
          format: uuid
      - *id004
      - *id005
      description: Server loads enabled provider by Tenant ID, uses Discovery, state/nonce/PKCE S256 and encrypted
        HttpOnly flow cookie. No caller-supplied issuer, identities, group facts or callback URI.
  /auth/oidc/{tenant}/callback:
    get:
      operationId: getAuthOidcTenantCallback
      summary: Complete protected Tenant OIDC flow
      security: []
      responses:
        '303':
          description: Fixed trusted-origin /auth/complete or /auth/failed redirect. Success sets Refresh cookie
            and clears flow cookie.
          headers:
            Location:
              schema:
                type: string
                format: uri
        default: *id001
      parameters:
      - name: tenant
        in: path
        required: true
        schema: *id006
      - name: state
        in: query
        required: false
        schema: &id007
          type: string
      - name: code
        in: query
        required: false
        schema: *id007
      - name: iss
        in: query
        required: false
        schema: *id007
      - name: error
        in: query
        required: false
        schema: *id007
      description: Requires flow cookie binding. Validated ID token and UserInfo sub, documented iserv:groups UUID
        intersection, exact issuer/subject identity, JIT TENANT/USER/PENDING. Provider tokens discarded. No tokens
        or provider error details in frontend redirect.
  /tenants:
    get:
      operationId: getTenants
      summary: List authorized Tenant identifiers
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenants'
        default: *id001
      description: Intentionally unpaged, ordered by createdAt DESC. No search/sort/page/deleted query parameters. ACTIVE GLOBAL ADMIN and ACTIVE GLOBAL USER may read the same complete Tenant projection. TENANT ADMIN/USER have no collection access; PENDING/DISABLED denied. GLOBAL USER context discovery grants no administration authority.
    post:
      operationId: postTenants
      summary: Create Tenant (GLOBAL ADMIN)
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Uuid'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantInput'
  /tenants/{id}:
    get:
      operationId: getTenantDetail
      summary: Read authorized Tenant by persistent UUID
      description: Independent application-service authorization. ACTIVE GLOBAL ADMIN and ACTIVE GLOBAL USER may read authorized Tenants; ACTIVE TENANT ADMIN may read only its signed Tenant. TENANT USER/PENDING/DISABLED denied; no Tenant list for TENANT ADMIN. Foreign and absent targets share a 404. Safe domain metadata only; no provider/credential projection or permanent read audit.
      security: *id003
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      responses:
        '200':
          description: Authorized Tenant detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantDetail'
        default: *id001
  /users:
    get:
      operationId: getUsers
      summary: List administratively manageable users
      security:
      - AccessBearer: []
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control:
            no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        default:
          description: RFC 9457 sanitized error; 400 invalid input, 401 authentication
            failure, 403 denied, 404 absent target, 409 conflict, 429 bounded throttling,
            503 unavailable verification.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      description: ACTIVE GLOBAL ADMIN authorized population with validated optional
        Tenant narrowing; ACTIVE TENANT ADMIN forced signed Tenant and TENANT scope, including
        all roles. Transport tenantId is ignored for TENANT authority; requested
        scope/role/status only intersect the forced set. Full SQL predicates/order precede
        bounded paging. Omission never means unbounded.
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: size
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: q
        in: query
        description: DisplayName-only trimmed literal case-insensitive substring; blank
          means no search; maximum 128 UTF-16 units after trimming; %, _ and backslash
          are literal.
        schema:
          type: string
          maxLength: 128
      - name: scope
        in: query
        description: Exact closed field; does not replace administrative authority.
        schema:
          type: string
          enum:
          - GLOBAL
          - TENANT
      - name: role
        in: query
        description: Exact closed field; does not replace administrative authority.
        schema:
          type: string
          enum:
          - ADMIN
          - USER
      - name: status
        in: query
        description: Exact closed field; does not replace administrative authority.
        schema:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - DISABLED
      - name: sort
        in: query
        description: Exact closed field; does not replace administrative authority.
        schema:
          type: string
          enum:
          - displayName
          - scope
          - role
          - status
      - name: direction
        in: query
        description: Direction requires explicit sort; selectable sort defaults asc.
          Default absent sort is createdAt DESC.
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: tenantId
        in: query
        description: Validated GLOBAL ADMIN narrowing only; ignored for TENANT authority.
        schema:
          type: string
          format: uuid
  /users/{id}:
    get:
      operationId: getUsersId
      summary: Read administratively authorized User by UUID
      description: Independent application-service scope; TENANT ADMIN sees all Users
        in its signed Tenant. Absent, foreign and GLOBAL targets outside that scope
        have the same 404. No credential/provider projection or audit write.
      security:
      - AccessBearer: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Safe detail projection with Tenant ID/name and authoritative
            metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetail'
        default:
          description: RFC 9457 sanitized error; 400 invalid input, 401 authentication
            failure, 403 denied, 404 absent target, 409 conflict, 429 bounded throttling,
            503 unavailable verification.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /users/global:
    post:
      operationId: postUsersGlobal
      summary: Create ACTIVE GLOBAL USER or ADMIN (GLOBAL ADMIN)
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalInput'
      description: Null Tenant, ACTIVE; optional role defaults to USER. GLOBAL ADMIN may create ADMIN atomically under the recovery guard. Initial provided password is the actual credential.
  /users/{id}/administration:
    put:
      operationId: putUserAdministration
      summary: Edit changed GLOBAL Email and/or User role atomically (GLOBAL ADMIN)
      security: *id003
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserAdministrationInput'
      responses:
        '200':
          description: Updated safe User identity state. Both changed fields and their sanitized audit events commit together or neither does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default: *id001
      description: GLOBAL ADMIN only. Omitted fields are unchanged; at least one actual change is required. Email is GLOBAL-only and pre-delivery verified. Role and self-protection rules match the existing guarded commands. No displayName, identity, scope, Tenant, status or OIDC changes.
  /users/{id}/approve:
    post:
      operationId: postUsersIdApprove
      summary: Approve PENDING account
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      description: GLOBAL ADMIN any; TENANT ADMIN own ordinary USER only, no ADMIN approval.
  /users/{id}/role:
    put:
      operationId: putUsersIdRole
      summary: Grant or change role (GLOBAL ADMIN)
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleInput'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      description: TENANT ADMIN cannot grant ADMIN. GLOBAL ADMIN cannot demote itself. No permanent last-admin invariant.
  /users/{id}/disable:
    post:
      operationId: postUsersIdDisable
      summary: Disable managed account
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      description: GLOBAL ADMIN any other account; TENANT ADMIN own ordinary USER only. GLOBAL ADMIN self-disable
        denied. Future Refresh denied; issued Access expires naturally.
  /users/{id}/local-credential:
    put:
      operationId: putUsersIdLocal-credential
      summary: Create/reset GLOBAL credential (GLOBAL ADMIN)
      security: *id003
      responses:
        '200':
          description: Successful operation; empty response body.
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CredentialInput'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      description: No TENANT credentials. Uniform policy; no forced-change state or JWT revocation.
  /users/{id}/email:
    put:
      security: *id003
      operationId: putUserEmail
      summary: Edit GLOBAL Email without changing password
      description: GLOBAL ADMIN only. Canonical Email is manually verified in I1. Credential/User metadata and sanitized audit update atomically; no Tenant local account. No self-disable/demotion semantics are introduced.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
      responses:
        '200':
          description: Email changed; no response body
        '400':
          <<: *id001
        '403':
          <<: *id001
        '404':
          <<: *id001
        '409':
          <<: *id001
  /oidc-configurations:
    get:
      operationId: listOidcConfigurations
      summary: List existing IServ configurations (ACTIVE GLOBAL ADMIN only)
      description: Bounded administrative read of enabled and disabled configurations, ordered by case-insensitive Tenant name then Tenant UUID. No secrets, groups, claims, credentials or mutation authority. Separate from anonymous enabled-organization login routing and signed-own Tenant singleton administration.
      security: *id003
      parameters:
      - in: query
        name: page
        schema: {type: integer, minimum: 0, default: 0}
      - in: query
        name: size
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Existing configurations and total count; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfigurationPage'
        default: *id001
  /tenants/{id}/oidc:
    get:
      operationId: getTenantsIdOidc
      summary: Read sanitized Tenant OIDC configuration (ACTIVE GLOBAL or own-Tenant ADMIN)
      description: ACTIVE ADMIN only. GLOBAL ADMIN targets an authorized concrete Tenant; TENANT ADMIN is forced to its signed Tenant and foreign locators share missing-resource behavior. USER/PENDING/DISABLED denied.
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfiguration'
        default: *id001
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
    put:
      operationId: putTenantsIdOidc
      summary: Create/update Tenant OIDC and group UUID allowlist (ACTIVE GLOBAL or own-Tenant ADMIN)
      security: *id003
      responses:
        '200':
          description: 'Successful operation. Authentication responses use Cache-Control: no-store.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OidcConfiguration'
        default: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProviderInput'
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      description: Atomic versioned settings/secret/allowlist change. Omit/null version on first create; current
        version on update. Initial clientSecret required; null on update retains/re-encrypts existing secret. Secret
        only accepted as write-only input, never returned. Empty allowlist denies login. Runtime changes need no
        image rebuild. Callback/final provisioning revalidate current configuration; valid recreated configuration may accept a pre-delete flow.
    delete:
      operationId: deleteTenantOidcConfiguration
      summary: Physically delete current Tenant OIDC singleton
      description: ACTIVE GLOBAL ADMIN or signed-own-Tenant ADMIN only. Requires current version. Atomically deletes encrypted secret/configuration and owned groups plus exactly one captured-Tenant OIDC_CONFIG_DELETED audit. Disabled is not deleted. Missing/repeated DELETE returns404 without another successful audit. Users/external mappings/JWTs remain. No generations/tombstones/restore. Recreation requires initial PUT with a fresh supplied secret.
      security: *id003
      parameters:
      - name: id
        in: path
        required: true
        schema: *id006
      - name: version
        in: query
        required: true
        description: Current configuration version; stale version conflicts. No other query parameters accepted.
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Deleted successfully; empty body
        default: *id001
  /tenants/{tenantId}/assets:
    post:
      operationId: postTenantsTenantidAssets
      summary: Register Asset; ADMIN only
      description: ACTIVE authorized principal; backend-loaded target facts and actors. TENANT effective scope comes exclusively from authenticated identity; supplied Tenant path cannot expand authority. GLOBAL Tenant context is validated narrowing, never membership/session state. Public Asset reads exclude internal soft deletion; DEREGISTERED
        remains visible.
      security: &id008
      - AccessBearer: []
      responses:
        '201':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          headers:
            Location:
              schema:
                type: string
              description: Created resource path
        default: &id009
          description: RFC 9457. 400 INVALID_INPUT; 401 AUTHENTICATION_REQUIRED; 403 FORBIDDEN; 404 NOT_FOUND including
            out-of-scope object; 409 guard/version/concurrency/constraint conflict; 503 SERVICE_UNAVAILABLE. No
            automatic mutation retry.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      parameters:
      - name: tenantId
        in: path
        required: true
        schema: &id010
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRegistration'
    get:
      operationId: getTenantsTenantidAssets
      summary: Read authorized Tenant Assets
      description: ACTIVE authorized principal; backend-loaded target facts and actors. TENANT effective scope comes exclusively from authenticated identity; supplied Tenant path cannot expand authority. GLOBAL Tenant context is validated narrowing, never membership/session state. Public Asset reads exclude internal soft deletion; DEREGISTERED
        remains visible.
      security: *id008
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        default: *id009
      parameters:
      - name: tenantId
        in: path
        required: true
        schema: *id010
      - &id011
        name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
      - &id012
        name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - &id013
        name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 128
          description: Trimmed literal case-insensitive substring of tag, local identifier, serial and external inventory number; SQL wildcards
            escaped.
      - &id014
        name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - tag
          - createdAt
          - lifecycle
          - condition
          default: createdAt
      - &id015
        name: direction
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - &id016
        name: locationId
        in: query
        required: false
        schema: *id010
      - &id017
        name: ownerId
        in: query
        required: false
        schema: *id010
      - &id018
        name: categoryId
        in: query
        required: false
        schema: *id010
      - &id019
        name: manufacturerId
        in: query
        required: false
        schema: *id010
      - &id020
        name: productId
        in: query
        required: false
        schema: *id010
      - &id021
        name: lifecycle
        in: query
        required: false
        schema: &id032
          type: string
          enum:
          - REGISTERED
          - IN_STOCK
          - DEPLOYED
          - DEREGISTERED
      - &id022
        name: condition
        in: query
        required: false
        schema: &id033
          type: string
          enum:
          - UNKNOWN
          - WORKING
          - DEFECTIVE
          - UNUSABLE
      - &id023
        name: loaned
        in: query
        required: false
        schema:
          type: boolean
      - name: loanable
        in: query
        required: false
        schema:
          type: boolean
      - name: localIdentifier
        in: query
