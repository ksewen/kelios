      security: *id008
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetPage'
        default: *id009
      parameters:
      - *id011
      - *id012
      - *id013
      - *id014
      - *id015
      - *id016
      - *id017
      - *id018
      - *id019
      - *id020
      - *id021
      - *id022
      - *id023
      - name: tenantId
        in: query
        required: false
        schema: *id010
  /assets/{id}:
