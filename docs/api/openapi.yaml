          maxLength: 2048
          description: Exact HTTPS IServ issuer; Discovery issuer must match.
        clientId:
          type: string
          minLength: 1
          maxLength: 2048
        clientSecret:
          type:
          - string
          - 'null'
          writeOnly: true
          maxLength: 2048
        enabled:
          type: boolean
        version:
          type:
          - integer
          - 'null'
          minimum: 0
        allowedGroupIds:
          type: array
          uniqueItems: true
          maxItems: 256
          items: *id006
    OidcConfigurationSummary:
