      security: *id008
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        default: *id009
      parameters:
      - name: id
        in: path
        required: true
        schema: *id010
      - *id011
      - *id012
  /assets/{id}/metadata:
    put:
      operationId: putAssetsIdMetadata
      summary: ADMIN explicit metadata command; expectedVersion required
      description: ACTIVE authorized principal; backend-loaded target facts and actors. Tenant path is validated
