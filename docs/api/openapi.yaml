components:
  securitySchemes:
    AccessBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 purpose Access, current signed scope/role/status snapshot. Refresh cookie is never an API
        business credential.
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      properties:
        type:
          type: string
          format: uri-reference
        title: *id007
        status:
          type: integer
        detail: *id007
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable safe business error, including INVALID_INPUT, STALE_ASSET_VERSION, INVALID_TRANSITION,
            LOAN_GUARD, NO_CURRENT_LOAN, OUTSTANDING_LOAN, REFERENCED, PRODUCT_EDIT_FROZEN, PROTECTED_UNKNOWN, DELETED_TARGET,
            INVALID_DEPENDENCY, MERGE_REQUIRES_GLOBAL_TARGET, CONCURRENT_OPERATION, CONSTRAINT_CONFLICT and SERVICE_UNAVAILABLE.
    TechnicalStatus:
      type: object
      required:
      - application
      - status
      properties:
        application:
          type: string
          const: KELIOS
        status:
          type: string
          const: ready
    Uuid: *id006
    Identity:
      type: object
      required:
      - id
      - scope
      - role
      - status
      - displayName
      properties:
        id: *id006
        scope:
          type: string
          enum:
          - GLOBAL
          - TENANT
        tenantId:
          type:
          - string
          - 'null'
          format: uuid
        role:
          type: string
          enum:
          - ADMIN
          - USER
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - DISABLED
        displayName: *id007
    Identities:
      type: array
      items:
        $ref: '#/components/schemas/Identity'
    Tenant:
      type: object
      additionalProperties: false
      required: [id, name, metadata]
      properties:
        id: *id006
        name:
          type: string
        metadata:
          $ref: '#/components/schemas/BusinessMetadata'
    TenantDetail:
      type: object
      additionalProperties: false
      required: [id, name, metadata]
      properties:
        id: *id006
        name:
          type: string
        metadata:
          $ref: '#/components/schemas/BusinessMetadata'
    Tenants:
      type: array
      items:
        $ref: '#/components/schemas/Tenant'
    Session:
      type: object
      required:
      - accessToken
      - expiresIn
      - user
      properties:
        accessToken:
          type: string
          description: RS256 Access JWT; memory only, never URL/browser persistent storage.
        expiresIn:
          type: integer
          const: 900
        user:
          $ref: '#/components/schemas/Identity'
    Csrf:
      type: object
      required:
      - token
      properties:
        token: *id007
    LocalLogin:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email: &id026
          type: string
          minLength: 3
          maxLength: 254
          format: email
          description: Practical ASCII Email, trimmed and lowercased; case-insensitively unique GLOBAL account identifier.
        password:
          type: string
          writeOnly: true
    PasswordChange:
      type: object
      additionalProperties: false
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword: &id027
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: 12–128 Unicode code points, not trimmed; uppercase, lowercase, digit and non-alphanumeric
            required. No forced-change state.
    OidcStart:
      type: object
      required:
      - authorizationUrl
      properties:
        authorizationUrl:
          type: string
          format: uri
    TenantInput:
      type: object
      additionalProperties: false
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
    GlobalInput:
      type: object
      additionalProperties: false
      required:
      - email
      - displayName
      - password
      properties:
        email: *id026
        displayName:
          type: string
          minLength: 1
          maxLength: 256
        password: *id027
        role:
          type: string
          enum: [USER, ADMIN]
          default: USER
          description: Optional creation role; GLOBAL ADMIN may create ADMIN in the same guarded transaction.
    UserAdministrationInput:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        email: *id026
        role:
          type: string
          enum: [USER, ADMIN]
      description: Omit unchanged fields. Explicit null and unknown fields are invalid. A Save with both fields is atomic; unchanged values alone conflict.
    RoleInput:
      type: object
      required:
      - role
      properties:
        role:
          type: string
          enum:
          - ADMIN
          - USER
    CredentialInput:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email: *id026
        password: *id027
    EmailInput:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: *id026
    GlobalAccount:
      type: object
      description: Safe GLOBAL-only administrative detail; never a Tenant local credential or universal User query field.
      properties:
        email:
          type: string
          format: email
        emailVerifiedAt:
          type: [string, "null"]
          format: date-time
    ProviderInput:
