      security: *id008
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default: *id009
      parameters:
      - name: id
        in: path
        required: true
        schema: *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCatalogCommand'
  /assets/{id}/loanability:
    put:
      operationId: putAssetsIdLoanability
      summary: ADMIN explicit loanability command; expectedVersion required
      description: ACTIVE authorized principal; backend-loaded target facts and actors. Tenant path is validated
