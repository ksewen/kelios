            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
        default: *id009
      parameters:
      - name: id
        in: path
        required: true
        schema: *id010
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MetadataCommand'
  /assets/{id}/catalog:
