name: kelios-phase0
services:
  backend:
    image: ${KELIOS_BACKEND_IMAGE:-kelios-backend:phase0}
    build: ../backend
    environment:
      KELIOS_DATABASE_URL: ${KELIOS_DATABASE_URL:-jdbc:postgresql://postgres:5432/kelios}
      KELIOS_DATABASE_USER: ${KELIOS_DATABASE_USER:-kelios}
    secrets: [db-password]
  frontend:
    image: ${KELIOS_FRONTEND_IMAGE:-kelios-frontend:phase0}
    build: ../frontend
    environment:
      KELIOS_CONFIG_FILE: /etc/kelios/branding/config.json
    ports: ["${KELIOS_BIND_ADDRESS:-127.0.0.1}:${KELIOS_HTTP_PORT:-8080}:8080"]
    volumes:
      - type: bind
        source: ${KELIOS_BRANDING_DIRECTORY:-./branding/${KELIOS_BRAND:-orange}}
        target: /etc/kelios/branding
        read_only: true
        bind: { create_host_path: false }
      - type: bind
        source: ${KELIOS_LOGO_DIRECTORY:-./branding/${KELIOS_BRAND:-orange}}
        target: /usr/share/nginx/html/runtime/logos
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      backend: { condition: service_healthy }
secrets:
  db-password:
    file: ${KELIOS_DB_PASSWORD_FILE:-./secrets/db-password}
