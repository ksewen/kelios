server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/kelios/tls/certificate.pem;
    ssl_certificate_key /etc/kelios/tls/private.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /usr/share/nginx/html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location = /runtime/config.json {
        alias /tmp/kelios/config.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /runtime/ { try_files $uri =404; add_header Cache-Control "no-store" always; }
    location = /assets/import { try_files $uri /index.html; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    # Callback URLs contain authorization codes; never write them to access logs.
    location /api/v1/auth/ {
        access_log off;
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location = /index.html { add_header Cache-Control "no-cache" always; }
    location / { try_files $uri /index.html; }
}
