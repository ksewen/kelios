services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kelios
      POSTGRES_USER: kelios
      POSTGRES_PASSWORD_FILE: /run/secrets/db-password
    secrets: [db-password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U kelios -d kelios"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  postgres-data:
